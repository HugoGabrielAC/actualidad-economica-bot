name: Actualizar portada

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar cotizaciones, fecha, pregunta, frase y personaje
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/actualizar_cotiz_hora.ps1
      - name: Guardar estado del dólar y de las preguntas
        run: |
          git config user.name "actualidad-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/portada/datos
          git diff --cached --quiet || git commit -m "estado dolar y preguntas"
          git push
